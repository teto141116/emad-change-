name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project verified successfully."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Android SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          echo ""
          echo "Installed SDK platforms:"
          find "$SDK/platforms" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print 2>/dev/null || true

          echo ""
          echo "Installed build tools:"
          find "$SDK/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print 2>/dev/null || true

          echo ""
          echo "Checking Android 36..."

          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "ERROR: Android platform 36 is not installed."
            exit 1
          fi

          echo "Android platform 36: OK"

          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            echo "ERROR: Build Tools 36.0.0 are not installed."
            exit 1
          fi

          echo "Build Tools 36.0.0: OK"

          echo ""
          echo "Android SDK verification completed successfully."

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.13"
          GRADLE_HOME="$HOME/gradle"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O "$HOME/gradle.zip"

            rm -rf "$GRADLE_HOME"

            unzip -q \
              "$HOME/gradle.zip" \
              -d "$HOME"

            mv \
              "$HOME/gradle-${GRADLE_VERSION}" \
              "$GRADLE_HOME"
          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building:"
          pwd

          gradle assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
