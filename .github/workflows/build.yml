name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          echo "Searching for Android project..."

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project verified successfully."

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Using Android SDK:"
          echo "$SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.13"
          GRADLE_DIR="$HOME/gradle"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            mkdir -p "$HOME"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O "$HOME/gradle.zip"

            rm -rf "$GRADLE_DIR"

            unzip -q \
              "$HOME/gradle.zip" \
              -d "$HOME"

            mv \
              "$HOME/gradle-${GRADLE_VERSION}" \
              "$GRADLE_DIR"
          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
