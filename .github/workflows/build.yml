name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              | sort \
              | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p "$ANDROID_HOME/licenses"

          printf '%s\n' \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK is ready."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android 36 platform found."
          echo "Build Tools 36.0.0 found."

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: eMaD_Google_Password_Helper.zip was not found."

            echo "Repository contents:"
            find . -maxdepth 3 -type f -print

            exit 1
          fi

          echo "Project ZIP found:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./eMaD_Google_Password_Helper.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f -print

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "extracted/settings.gradle.kts"
          test -f "extracted/build.gradle.kts"
          test -f "extracted/app/build.gradle.kts"
          test -f "extracted/app/src/main/AndroidManifest.xml"

          echo "Android project verified successfully."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd extracted

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
         
