name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find eMaD project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: eMaD_Google_Password_Helper.zip was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

      - name: Extract eMaD project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./eMaD_Google_Password_Helper.zip" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f -print

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "extracted/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -d "extracted/app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd extracted

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
