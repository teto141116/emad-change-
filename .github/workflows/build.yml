name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check Android SDK
        shell: bash
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: eMaD_Google_Password_Helper.zip was not found."
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found project ZIP:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./eMaD_Google_Password_Helper.zip" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f -print

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f extracted/settings.gradle.kts
          test -f extracted/build.gradle.kts
          test -f extracted/app/build.gradle.kts
          test -f extracted/app/src/main/AndroidManifest.xml

          echo "Android project verified successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd extracted

          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
