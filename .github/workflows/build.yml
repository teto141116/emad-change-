name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          mkdir -p "$SDK_ROOT/licenses"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"

          echo "Android SDK licenses prepared."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36 is ready."

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./eMaD_Google_Password_Helper.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: eMaD_Google_Password_Helper.zip was not found."

            echo "Repository contents:"
            find . -maxdepth 2 -type f -print

            exit 1
          fi

          echo "Found project:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./eMaD_Google_Password_Helper.zip" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f -print

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "extracted/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "extracted/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "extracted/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd extracted

          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-Google-Password-Helper-debug
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
